<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">О нас</a>
            <a href="lunch.html">Собрать ланч</a>
            <a class="active" href="order.html">Оформить заказ</a>
            <a href="orders.html">Заказы</a>
            <a href="feedback.html">Обратная связь</a>
            <a href="#contacts">Контакты</a>
            <a href="login.html">Вход</a>
        </nav>
    </header>

    <main>

        <section class="feedback">
            <h2>Обратная связь</h2>
            <form action="#" method="post" enctype="multipart/form-data">

                <label for="fio">ФИО</label>
                <input type="text" id="fio" name="fio" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Откуда узнали о нас</legend>
                    <label><input type="radio" name="source" value="search" checked> Интернет</label>
                    <label><input type="radio" name="source" value="friends"> Друзья</label>
                    <label><input type="radio" name="source" value="ads"> Реклама</label>
                </fieldset>

                <label for="type">Тип обращения</label>
                <select id="type" name="type">
                    <option value="complaint">Жалоба</option>
                    <option value="suggestion">Предложение</option>
                </select>

                <label for="message">Текст сообщения</label>
                <textarea id="message" name="message" rows="6" placeholder="Напишите ваше сообщение..."></textarea>

                <label for="file">Вложение</label>
                <input type="file" id="file" name="file">

                <label class="checkbox">
                    <input type="checkbox" name="agree" required>
                    Даю согласие на обработку персональных данных
                </label>

                <button type="submit">Отправить</button>
            </form>
        </section>

    </main>

    <footer id="contacts">
        <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>

</body>
</html>
